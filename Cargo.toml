[package]
name = "hash-hunter"
version = "0.1.0"
edition = "2024"
description = "Find unusual single and composite patterns in Git commit hashes"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
